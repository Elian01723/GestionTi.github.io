<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedelía U - Dashboard y Control de Equipos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <div id="app" class="h-full flex flex-col">
        <!-- Contenido renderizado dinámicamente -->
    </div>

    <script>
        const STORAGE_KEY = 'bedelia_app_advanced_db_v3';
        
        let state = loadState();

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch(e) { console.error(e); }
            }
            return {
                currentUser: null,
                activeTab: 'dashboard',
                profesores: [
                    { cc: '1098765432', nombre: 'Dr. Carlos Mendoza' },
                    { cc: '1023456789', nombre: 'Dra. Ana María Gómez' },
                    { cc: '1045678912', nombre: 'Ing. Luis Fernando Ruiz' }
                ],
                equipos: [
                    { codigo: 'VB-01', tipo: 'Video-beam', modelo: 'Epson PowerLite X49', estado: 'Disponible' },
                    { codigo: 'VB-02', tipo: 'Video-beam', modelo: 'Sony VPL-EX435', estado: 'Prestado' },
                    { codigo: 'PC-01', tipo: 'Laptop', modelo: 'Dell Latitude 3420', estado: 'Disponible' },
                    { codigo: 'PC-02', tipo: 'Laptop', modelo: 'Lenovo ThinkPad E14', estado: 'Prestado' }
                ],
                prestamos: [
                    { id: 101, cc: '1098765432', nombre: 'Dr. Carlos Mendoza', equipo: 'VB-02 - Video-beam (Sony VPL-EX435)', codigoEquipo: 'VB-02', horaSalida: '08:30 AM', estado: 'Activo' },
                    { id: 102, cc: '1023456789', nombre: 'Dra. Ana María Gómez', equipo: 'PC-02 - Laptop (Lenovo ThinkPad E14)', codigoEquipo: 'PC-02', horaSalida: '09:15 AM', estado: 'Activo' }
                ],
                historialLogs: [
                    { id: 1, fecha: 'Hoy, 09:15 AM', tipo: 'PRÉSTAMO', descripcion: 'Dra. Ana María Gómez retiró Laptop (PC-02)', color: 'blue' },
                    { id: 2, fecha: 'Hoy, 08:30 AM', tipo: 'PRÉSTAMO', descripcion: 'Dr. Carlos Mendoza retiró Video-beam (VB-02)', color: 'blue' },
                    { id: 3, fecha: 'Ayer, 02:00 PM', tipo: 'EQUIPO', descripcion: 'Se registró nuevo Video-beam (VB-02)', color: 'indigo' },
                    { id: 4, fecha: 'Ayer, 10:00 AM', tipo: 'PROFESOR', descripcion: 'Se registró nuevo profesor Dr. Carlos Mendoza', color: 'emerald' }
                ],
                toast: null
            };
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function registrarLog(tipo, descripcion, color) {
            const now = new Date();
            const fecha = `Hoy, ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            state.historialLogs.unshift({ id: Date.now(), fecha, tipo, descripcion, color });
        }

        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) {
                    state.toast = null;
                    render();
                }
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');

            if (!state.currentUser) {
                app.innerHTML = renderLoginScreen();
                return;
            }

            app.innerHTML = `
                <div class="h-full flex flex-col md:flex-row bg-slate-950 overflow-hidden">
                    ${renderSidebar()}
                    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-900 border-l border-slate-800">
                        ${renderHeader()}
                        <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
                            ${state.toast ? renderToast() : ''}
                            <div class="max-w-7xl mx-auto fade-in">
                                ${
                                    state.activeTab === 'dashboard' ? renderDashboardView() :
                                    state.activeTab === 'prestamos' ? renderPrestamosView() :
                                    state.activeTab === 'equipos' ? renderEquiposView() :
                                    state.activeTab === 'profesores' ? renderProfesoresView() :
                                    state.activeTab === 'historial' ? renderHistorialView() : ''
                                }
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }

        function renderLoginScreen() {
            return `
                <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-950">
                    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-8 space-y-6 fade-in">
                        <div class="text-center space-y-2">
                            <div class="inline-flex p-3.5 bg-blue-600/20 border border-blue-500/30 text-blue-400 rounded-2xl mb-1">
                                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">Bedelía Universitaria</h1>
                            <p class="text-xs text-slate-400">Panel administrativo con dashboard y control en tiempo real</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Usuario / Correo</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                                        <i class="fa-solid fa-envelope text-xs"></i>
                                    </span>
                                    <input type="text" id="loginUser" required value="bedelia.admin@universidad.edu"
                                        class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition-all">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Contraseña</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                                        <i class="fa-solid fa-lock text-xs"></i>
                                    </span>
                                    <input type="password" id="loginPass" required value="123456"
                                        class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition-all">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center space-x-2">
                                <span>Iniciar Sesión en el Sistema</span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            state.currentUser = { name: 'Operador Bedelía', role: 'Administrador General' };
            saveState();
            showToast('¡Sesión iniciada correctamente!');
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            saveState();
            showToast('Sesión finalizada', 'info');
            render();
        }

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', label: 'Dashboard General', icon: 'fa-chart-pie' },
                { id: 'prestamos', label: 'Préstamos & Salidas', icon: 'fa-clipboard-list' },
                { id: 'equipos', label: 'Gestión de Equipos', icon: 'fa-desktop' },
                { id: 'profesores', label: 'Directorio Profesores', icon: 'fa-chalkboard-user' },
                { id: 'historial', label: 'Historial y Logs', icon: 'fa-clock-rotate-left' }
            ];

            return `
                <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
                    <div>
                        <div class="p-6 flex items-center space-x-3 border-b border-slate-800/80">
                            <div class="p-2.5 bg-blue-600 text-white rounded-xl shadow-md shadow-blue-600/30">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-sm tracking-wide text-white">BEDELÍA U</h2>
                                <p class="text-[11px] text-slate-400">Control Inteligente</p>
                            </div>
                        </div>

                        <nav class="p-4 space-y-1.5">
                            ${tabs.map(t => `
                                <button onclick="switchTab('${t.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold transition-all ${state.activeTab === t.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'}">
                                    <i class="fa-solid ${t.icon} w-4 text-center"></i>
                                    <span>${t.label}</span>
                                </button>
                            `).join('')}
                        </nav>
                    </div>

                    <div class="p-4 border-t border-slate-800/80 m-4 bg-slate-900/60 rounded-2xl flex items-center justify-between">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-9 h-9 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-300 font-semibold flex items-center justify-center shrink-0">
                                ${state.currentUser.name.charAt(0)}
                            </div>
                            <div class="truncate">
                                <p class="text-xs font-semibold text-slate-200 truncate">${state.currentUser.name}</p>
                                <p class="text-[10px] text-slate-400 truncate">${state.currentUser.role}</p>
                            </div>
                        </div>
                        <button onclick="handleLogout()" title="Cerrar Sesión" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors">
                            <i class="fa-solid fa-power-off text-xs"></i>
                        </button>
                    </div>
                </aside>
            `;
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function renderHeader() {
            const titles = {
                dashboard: { title: 'Dashboard y Analítica', sub: 'Resumen general del estado de equipos y actividad reciente' },
                prestamos: { title: 'Control de Salidas y Préstamos', sub: 'Gestione préstamos en tiempo real con búsqueda por CC o nombre' },
                equipos: { title: 'Inventario de Equipos', sub: 'Administre computadores portátiles y video-beams disponibles' },
                profesores: { title: 'Directorio de Profesores', sub: 'Base de datos de docentes habilitados en la institución' },
                historial: { title: 'Registro y Auditoría de Actividad', sub: 'Historial completo de cada movimiento realizado en el sistema' }
            };
            const current = titles[state.activeTab] || {};

            return `
                <header class="bg-slate-950/60 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
                    <div>
                        <h1 class="text-base font-bold text-white">${current.title}</h1>
                        <p class="text-xs text-slate-400">${current.sub}</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 font-medium flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Sistema Activo</span>
                        </div>
                    </div>
                </header>
            `;
        }

        function renderToast() {
            if (!state.toast) return '';
            const bg = state.toast.type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-300' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300';
            const icon = state.toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            return `
                <div class="fixed bottom-6 right-6 z-50 flex items-center space-x-3 px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl ${bg} fade-in">
                    <i class="fa-solid ${icon}"></i>
                    <span class="text-xs font-medium">${state.toast.message}</span>
                </div>
            `;
        }

        function renderDashboardView() {
            const totalPrestamosActivos = state.prestamos.filter(p => p.estado === 'Activo').length;
            const totalEquipos = state.equipos.length;
            const equiposDisponibles = state.equipos.filter(e => e.estado === 'Disponible').length;
            const equiposPrestados = state.equipos.filter(e => e.estado === 'Prestado').length;
            const totalProfes = state.profesores.length;

            const videoBeams = state.equipos.filter(e => e.tipo.includes('Video-beam'));
            const laptops = state.equipos.filter(e => e.tipo.includes('Laptop') || e.tipo.includes('Computador'));
            const vbDisponibles = videoBeams.filter(e => e.estado === 'Disponible').length;
            const pcDisponibles = laptops.filter(e => e.estado === 'Disponible').length;

            return `
                <div class="space-y-6">
                    <!-- Tarjetas de Estadísticas Principales -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Préstamos Activos</span>
                                <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${totalPrestamosActivos}</span>
                                <span class="text-xs text-blue-400 font-medium">Equipos fuera</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Inventario Total</span>
                                <div class="p-2.5 bg-indigo-500/10 text-indigo-400 rounded-xl"><i class="fa-solid fa-boxes-stacked"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${totalEquipos}</span>
                                <span class="text-xs text-indigo-400 font-medium">Dispositivos reg.</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Disponibles</span>
                                <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl"><i class="fa-solid fa-circle-check"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${equiposDisponibles}</span>
                                <span class="text-xs text-emerald-400 font-medium">Listos para entrega</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Docentes en BD</span>
                                <div class="p-2.5 bg-purple-500/10 text-purple-400 rounded-xl"><i class="fa-solid fa-users"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${totalProfes}</span>
                                <span class="text-xs text-purple-400 font-medium">Habilitados</span>
                            </div>
                        </div>
                    </div>

                    <!-- Gráficos y Desglose Visual -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Desglose por Tipo de Equipo -->
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                            <h3 class="font-bold text-white text-sm flex items-center justify-between">
                                <span>Desglose por Tipo de Activo</span>
                                <i class="fa-solid fa-chart-bar text-slate-500 text-xs"></i>
                            </h3>
                            <div class="space-y-4 pt-2">
                                <div>
                                    <div class="flex justify-between text-xs mb-1">
                                        <span class="text-slate-300 font-medium">Laptops / Computadores (${laptops.length} total)</span>
                                        <span class="text-emerald-400">${pcDisponibles} disponibles</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800">
                                        <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${laptops.length ? (pcDisponibles / laptops.length) * 100 : 0}%"></div>
                                    </div>
                                </div>

                                <div>
                                    <div class="flex justify-between text-xs mb-1">
                                        <span class="text-slate-300 font-medium">Video-beams (${videoBeams.length} total)</span>
                                        <span class="text-emerald-400">${vbDisponibles} disponibles</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800">
                                        <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: ${videoBeams.length ? (vbDisponibles / videoBeams.length) * 100 : 0}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Estado General del Inventario -->
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                            <h3 class="font-bold text-white text-sm flex items-center justify-between">
                                <span>Estado Operativo del Inventario</span>
                                <i class="fa-solid fa-circle-nodes text-slate-500 text-xs"></i>
                            </h3>
                            <div class="grid grid-cols-2 gap-4 pt-2">
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-center space-y-1">
                                    <p class="text-2xl font-bold text-emerald-400">${equiposDisponibles}</p>
                                    <p class="text-xs text-slate-400 font-medium">Disponibles en Bodega</p>
                                </div>
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-center space-y-1">
                                    <p class="text-2xl font-bold text-amber-400">${equiposPrestados}</p>
                                    <p class="text-xs text-slate-400 font-medium">Prestados / En Clase</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actividad Reciente en el Dashboard -->
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-white text-sm">Últimos Movimientos Registrados</h3>
                            <button onclick="switchTab('historial')" class="text-xs text-blue-400 hover:underline">Ver historial completo</button>
                        </div>
                        <div class="divide-y divide-slate-800 text-xs">
                            ${state.historialLogs.slice(0, 4).map(log => `
                                <div class="py-3 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <span class="w-2 h-2 rounded-full bg-${log.color === 'blue' ? 'blue' : log.color === 'indigo' ? 'indigo' : 'emerald'}-500"></span>
                                        <span class="text-slate-200 font-medium">${log.descripcion}</span>
                                    </div>
                                    <span class="text-slate-500 text-[11px]">${log.fecha}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPrestamosView() {
            const equiposDisponibles = state.equipos.filter(e => e.estado === 'Disponible');

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Formulario Salida -->
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                        <div>
                            <h3 class="font-bold text-white text-sm">Registrar Salida de Equipo</h3>
                            <p class="text-xs text-slate-400">Seleccione docente y equipo disponible</p>
                        </div>

                        <form onsubmit="registrarPrestamo(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Buscar Profesor (CC o Nombre)</label>
                                <input type="text" id="busquedaProfesorInput" placeholder="Ej. 1098 o Carlos..." oninput="filtrarProfesoresDropdown(this.value)"
                                    class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                <div id="dropdownSugerenciasProf" class="mt-1 max-h-36 overflow-y-auto space-y-1 bg-slate-900 border border-slate-800 rounded-xl p-1 hidden"></div>
                                <input type="hidden" id="selectedProfCC" required>
                                <div id="profesorSeleccionadoNota" class="mt-1.5 text-[11px] text-blue-400 font-medium hidden"></div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Equipo Disponible</label>
                                <select id="selectEquipoPrestamo" required class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                    <option value="">Seleccione equipo disponible...</option>
                                    ${equiposDisponibles.map(e => `
                                        <option value="${e.codigo}">${e.codigo} - ${e.tipo} (${e.modelo})</option>
                                    `).join('')}
                                </select>
                            </div>

                            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-check"></i>
                                <span>Registrar Préstamo</span>
                            </button>
                        </form>
                    </div>

                    <!-- Tabla de Préstamos Activos -->
                    <div class="lg:col-span-2 bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                        <div>
                            <h3 class="font-bold text-white text-sm">Préstamos Activos en Curso</h3>
                            <p class="text-xs text-slate-400">Listado actual con opción de devolución rápida</p>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                        <th class="py-3 px-3">Docente</th>
                                        <th class="py-3 px-3">Cédula (CC)</th>
                                        <th class="py-3 px-3">Equipo</th>
                                        <th class="py-3 px-3">Hora Salida</th>
                                        <th class="py-3 px-3 text-right">Acción</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800 text-xs">
                                    ${state.prestamos.length === 0 ? `
                                        <tr>
                                            <td colspan="5" class="py-12 text-center text-slate-500">No hay préstamos activos registrados.</td>
                                        </tr>
                                    ` : state.prestamos.map(p => `
                                        <tr class="hover:bg-slate-900/50">
                                            <td class="py-3.5 px-3 font-medium text-slate-200">${p.nombre}</td>
                                            <td class="py-3.5 px-3 font-mono text-slate-400">${p.cc}</td>
                                            <td class="py-3.5 px-3 text-slate-300">${p.equipo}</td>
                                            <td class="py-3.5 px-3 text-slate-400">${p.horaSalida}</td>
                                            <td class="py-3.5 px-3 text-right">
                                                <button onclick="devolverEquipo(${p.id}, '${p.codigoEquipo}', '${p.nombre}')" class="px-3 py-1.5 bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-xl font-semibold transition-all">
                                                    Recibir / Devolver
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function filtrarProfesoresDropdown(query) {
            const container = document.getElementById('dropdownSugerenciasProf');
            if (!query.trim()) {
                container.classList.add('hidden');
                return;
            }
            const q = query.toLowerCase();
            const matches = state.profesores.filter(p => p.cc.includes(q) || p.nombre.toLowerCase().includes(q));

            if (matches.length === 0) {
                container.innerHTML = `<div class="p-2 text-xs text-slate-500 text-center">No se encontró profesor</div>`;
            } else {
                container.innerHTML = matches.map(p => `
                    <div onclick="seleccionarProfesorPrestamo('${p.cc}', '${p.nombre}')" class="p-2 hover:bg-slate-800 rounded-lg cursor-pointer text-xs">
                        <div class="font-semibold text-slate-200">${p.nombre}</div>
                        <div class="text-[10px] text-slate-400 font-mono">CC: ${p.cc}</div>
                    </div>
                `).join('');
            }
            container.classList.remove('hidden');
        }

        function seleccionarProfesorPrestamo(cc, nombre) {
            document.getElementById('selectedProfCC').value = cc;
            document.getElementById('busquedaProfesorInput').value = `${nombre} (CC: ${cc})`;
            document.getElementById('dropdownSugerenciasProf').classList.add('hidden');
            const nota = document.getElementById('profesorSeleccionadoNota');
            nota.textContent = `✓ Docente seleccionado correctamente`;
            nota.classList.remove('hidden');
        }

        function registrarPrestamo(e) {
            e.preventDefault();
            const cc = document.getElementById('selectedProfCC').value;
            const codigoEquipo = document.getElementById('selectEquipoPrestamo').value;

            if (!cc) {
                showToast('Por favor seleccione un profesor válido de la lista', 'error');
                return;
            }

            const profesor = state.profesores.find(p => p.cc === cc);
            const equipo = state.equipos.find(eq => eq.codigo === codigoEquipo);

            if (!profesor || !equipo) {
                showToast('Datos inválidos para procesar el préstamo', 'error');
                return;
            }

            equipo.estado = 'Prestado';

            state.prestamos.unshift({
                id: Date.now(),
                cc: profesor.cc,
                nombre: profesor.nombre,
                equipo: `${equipo.codigo} - ${equipo.tipo} (${equipo.modelo})`,
                codigoEquipo: equipo.codigo,
                horaSalida: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                estado: 'Activo'
            });

            registrarLog('PRÉSTAMO', `${profesor.nombre} retiró ${equipo.tipo} (${equipo.codigo})`, 'blue');
            saveState();
            showToast('¡Préstamo registrado exitosamente!');
            render();
        }

        function devolverEquipo(prestamoId, codigoEquipo, nombreProf) {
            state.prestamos = state.prestamos.filter(p => p.id !== prestamoId);
            const equipo = state.equipos.find(eq => eq.codigo === codigoEquipo);
            if (equipo) {
                equipo.estado = 'Disponible';
            }
            registrarLog('DEVOLUCIÓN', `Se recibió ${codigoEquipo} entregado por ${nombreProf}`, 'emerald');
            saveState();
            showToast('Equipo recibido y liberado en inventario');
            render();
        }

        function renderEquiposView() {
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                        <div>
                            <h3 class="font-bold text-white text-sm">Registrar Nuevo Equipo</h3>
                            <p class="text-xs text-slate-400">Añada PCs o video-beams al inventario</p>
                        </div>

                        <form onsubmit="registrarEquipo(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Código / Inventario</label>
                                <input type="text" id="nuevoEqCodigo" required placeholder="Ej. VB-03 o PC-03"
                                    class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Tipo de Equipo</label>
                                <select id="nuevoEqTipo" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                    <option value="Video-beam">Video-beam</option>
                                    <option value="Laptop">Laptop / Computador</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Modelo y Marca</label>
                                <input type="text" id="nuevoEqModelo" required placeholder="Ej. Epson PowerLite X49"
                                    class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>

                            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-plus-circle"></i>
                                <span>Guardar en Inventario</span>
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                        <div>
                            <h3 class="font-bold text-white text-sm">Inventario General Registrado</h3>
                            <p class="text-xs text-slate-400">Listado sincronizado de dispositivos disponibles y prestados</p>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                        <th class="py-3 px-3">Código</th>
                                        <th class="py-3 px-3">Tipo</th>
                                        <th class="py-3 px-3">Modelo</th>
                                        <th class="py-3 px-3">Estado</th>
                                        <th class="py-3 px-3 text-right">Acción</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800 text-xs">
                                    ${state.equipos.map(e => {
                                        const badge = e.estado === 'Disponible' 
                                            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                                            : 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                                        return `
                                            <tr class="hover:bg-slate-900/50">
                                                <td class="py-3.5 px-3 font-mono text-blue-400 font-semibold">${e.codigo}</td>
                                                <td class="py-3.5 px-3 text-slate-200">${e.tipo}</td>
                                                <td class="py-3.5 px-3 text-slate-300">${e.modelo}</td>
                                                <td class="py-3.5 px-3">
                                                    <span class="inline-flex px-2.5 py-1 rounded-full text-[10px] font-semibold border ${badge}">
                                                        ${e.estado}
                                                    </span>
                                                </td>
                                                <td class="py-3.5 px-3 text-right">
                                                    <button onclick="eliminarEquipo('${e.codigo}', '${e.tipo}')" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors" title="Eliminar equipo">
                                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function registrarEquipo(e) {
            e.preventDefault();
            const codigo = document.getElementById('nuevoEqCodigo').value.trim().toUpperCase();
            const tipo = document.getElementById('nuevoEqTipo').value;
            const modelo = document.getElementById('nuevoEqModelo').value.trim();

            if (state.equipos.some(eq => eq.codigo === codigo)) {
                showToast('Ya existe un equipo registrado con ese código ID', 'error');
                return;
            }

            state.equipos.push({ codigo, tipo, modelo, estado: 'Disponible' });
            registrarLog('EQUIPO', `Se registró nuevo equipo ${tipo} (${codigo})`, 'indigo');
            saveState();
            showToast('¡Equipo agregado exitosamente al inventario!');
            render();
        }

        function eliminarEquipo(codigo, tipo) {
            state.equipos = state.equipos.filter(e => e.codigo !== codigo);
            state.prestamos = state.prestamos.filter(p => p.codigoEquipo !== codigo);
            registrarLog('EQUIPO', `Se eliminó equipo ${tipo} (${codigo})`, 'rose');
            saveState();
            showToast('Equipo eliminado del sistema', 'info');
            render();
        }

        function renderProfesoresView() {
            const searchQuery = window.profSearchFilter || '';
            const filtrados = state.profesores.filter(p => p.cc.includes(searchQuery) || p.nombre.toLowerCase().includes(searchQuery.toLowerCase()));

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                        <div>
                            <h3 class="font-bold text-white text-sm">Registrar Nuevo Profesor</h3>
                            <p class="text-xs text-slate-400">Añada docentes a la base de datos institucional</p>
                        </div>

                        <form onsubmit="registrarProfesor(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Número de Cédula (CC)</label>
                                <input type="text" id="nuevoProfCC" required placeholder="Ej. 1098765432"
                                    class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Nombre Completo</label>
                                <input type="text" id="nuevoProfNombre" required placeholder="Ej. Dra. María Fernanda"
                                    class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>

                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-user-plus"></i>
                                <span>Guardar Profesor</span>
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                                <h3 class="font-bold text-white text-sm">Directorio de Docentes</h3>
                                <p class="text-xs text-slate-400">Búsqueda rápida por cédula o nombre</p>
                            </div>
                            <div class="relative w-full sm:w-60">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 pointer-events-none">
                                    <i class="fa-solid fa-search text-xs"></i>
                                </span>
                                <input type="text" placeholder="Filtrar docente..." value="${searchQuery}" oninput="window.profSearchFilter=this.value; render();"
                                    class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                        <th class="py-3 px-3">Cédula (CC)</th>
                                        <th class="py-3 px-3">Nombre Completo</th>
                                        <th class="py-3 px-3 text-right">Acción</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800 text-xs">
                                    ${filtrados.length === 0 ? `
                                        <tr>
                                            <td colspan="3" class="py-12 text-center text-slate-500">No se encontraron profesores registrados.</td>
                                        </tr>
                                    ` : filtrados.map(p => `
                                        <tr class="hover:bg-slate-900/50">
                                            <td class="py-3.5 px-3 font-mono text-emerald-400 font-medium">${p.cc}</td>
                                            <td class="py-3.5 px-3 font-medium text-slate-200">${p.nombre}</td>
                                            <td class="py-3.5 px-3 text-right">
                                                <button onclick="eliminarProfesor('${p.cc}', '${p.nombre}')" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors" title="Eliminar profesor">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function registrarProfesor(e) {
            e.preventDefault();
            const cc = document.getElementById('nuevoProfCC').value.trim();
            const nombre = document.getElementById('nuevoProfNombre').value.trim();

            if (state.profesores.some(p => p.cc === cc)) {
                showToast('Ya existe un profesor registrado con esa cédula (CC)', 'error');
                return;
            }

            state.profesores.push({ cc, nombre });
            registrarLog('PROFESOR', `Se registró nuevo profesor ${nombre} (CC: ${cc})`, 'emerald');
            saveState();
            showToast('¡Profesor agregado exitosamente al directorio!');
            render();
        }

        function eliminarProfesor(cc, nombre) {
            state.profesores = state.profesores.filter(p => p.cc !== cc);
            registrarLog('PROFESOR', `Se eliminó profesor ${nombre}`, 'rose');
            saveState();
            showToast('Profesor eliminado del registro', 'info');
            render();
        }

        function renderHistorialView() {
            return `
                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-white text-sm">Auditoría y Registro General</h3>
                            <p class="text-xs text-slate-400">Historial completo en tiempo real de préstamos, devoluciones, equipos y profesores</p>
                        </div>
                        <button onclick="state.historialLogs=[]; saveState(); render();" class="px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400 text-xs rounded-xl transition-all">
                            Limpiar Historial
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="py-3 px-3">Fecha / Hora</th>
                                    <th class="py-3 px-3">Tipo de Evento</th>
                                    <th class="py-3 px-3">Descripción de la Acción</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-xs">
                                ${state.historialLogs.length === 0 ? `
                                    <tr>
                                        <td colspan="3" class="py-12 text-center text-slate-500">No hay registros en el historial.</td>
                                    </tr>
                                ` : state.historialLogs.map(log => {
                                    const badge = 
                                        log.tipo === 'PRÉSTAMO' ? 'bg-blue-500/10 text-blue-400 border-blue-500/30' :
                                        log.tipo === 'DEVOLUCIÓN' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                                        log.tipo === 'EQUIPO' ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30' :
                                        'bg-purple-500/10 text-purple-400 border-purple-500/30';
                                    return `
                                        <tr class="hover:bg-slate-900/50">
                                            <td class="py-3.5 px-3 font-mono text-slate-400">${log.fecha}</td>
                                            <td class="py-3.5 px-3">
                                                <span class="inline-flex px-2.5 py-1 rounded-full text-[10px] font-semibold border ${badge}">
                                                    ${log.tipo}
                                                </span>
                                            </td>
                                            <td class="py-3.5 px-3 text-slate-200 font-medium">${log.descripcion}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
